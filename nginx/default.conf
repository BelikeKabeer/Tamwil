upstream emi_service {
    server backend-emi.default.svc.cluster.local:5000;
}

upstream loan_service {
    server backend-loan.default.svc.cluster.local:5000;
}

upstream sip_service {
    server backend-sip.default.svc.cluster.local:5000;
}

server {
    listen 80;
    server_name localhost;

    resolver 172.20.0.10 valid=10s;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }

    # Route for EMI Backend
    location /api/calculate {
        proxy_pass http://emi_service/api/calculate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Route for Loan Backend
    location /api/submit-loan {
        proxy_pass http://loan_service/submit-loan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Route for SIP Backend
    location /sip-calc/api/ {
        proxy_pass http://sip_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
