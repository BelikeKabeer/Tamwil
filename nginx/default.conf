server {
    listen 80;
    server_name localhost;

    resolver 172.20.0.10 valid=10s;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }

    # Route for EMI Backend
    location /api/calculate {
        set $emi_upstream "http://backend-emi.default.svc.cluster.local:5000/api/calculate";
        proxy_pass $emi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Route for Loan Backend
    location /api/submit-loan {
        set $loan_upstream "http://backend-loan.default.svc.cluster.local:5000/submit-loan";
        proxy_pass $loan_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Route for SIP Backend
    location /sip-calc/api/ {
        set $sip_upstream "http://backend-sip.default.svc.cluster.local:5000/api/";
        proxy_pass $sip_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
