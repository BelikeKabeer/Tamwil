server {
    listen 80;
    server_name localhost;

    resolver 172.20.0.10 valid=10s ipv6=off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }

    # Route for EMI Backend
    location /api/calculate {
        set $emi_backend "http://backend-emi.default.svc.cluster.local:5000/api/calculate";
        proxy_pass $emi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Route for Loan Backend
    location /api/submit-loan {
        set $loan_backend "http://backend-loan.default.svc.cluster.local:5000/submit-loan";
        proxy_pass $loan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Route for SIP Backend
    location /sip-calc/api/calculate {
        set $sip_backend "http://backend-sip.default.svc.cluster.local:5000/calculate";
        proxy_pass $sip_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sip-calc/api/ {
        set $sip_backend_base "http://backend-sip.default.svc.cluster.local:5000/";
        proxy_pass $sip_backend_base;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
