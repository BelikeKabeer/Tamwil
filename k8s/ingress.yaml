apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tamwil-ingress
  annotations:
    # Tells AWS to automatically provision an Application Load Balancer (ALB)
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-proxy
            port:
              number: 80